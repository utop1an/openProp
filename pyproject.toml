[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openprop"
version = "0.1.0"
description = "Open-world, property-guided entity matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenProp contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
openai = ["openai>=1.0"]
ml = ["torch>=2"]
paper = ["matplotlib>=3.8"]
sim = ["ai2thor==5.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

